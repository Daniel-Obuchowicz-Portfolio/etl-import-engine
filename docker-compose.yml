services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: etl
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d etl"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://etl:etl@postgres:5432/etl
      IMPORT_BATCH_SIZE: ${IMPORT_BATCH_SIZE:-1000}
      API_REQUEST_TIMEOUT_SECONDS: ${API_REQUEST_TIMEOUT_SECONDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mock-api:
    build: .
    command: ["uvicorn", "mock_api.main:app", "--host", "0.0.0.0", "--port", "9000"]
    ports:
      - "9000:9000"

volumes:
  postgres_data:

